<!-- New Student -->
<template>

    <lightning-card icon-name="standard:user" title="New Student" class="slds-card__body_inner">

        <lightning-record-edit-form object-api-name="Student__c" onsuccess={handleSuccess} onerror={handleError}>

            <lightning-messages></lightning-messages>

            <div class="slds-m-bottom_small">
                <lightning-input-field field-name="First_Name__c">
                </lightning-input-field>

                <lightning-input-field field-name="Last_Name__c">
                </lightning-input-field>

                <lightning-input-field field-name="EMSO_Text__c">
                </lightning-input-field>

                <lightning-input-field field-name="Enrollment_Type__c" onchange={handleEnrollmentTypeChange}>
                </lightning-input-field>

                <template if:true={showPayerField}>
                    <lightning-input-field field-name="Payer__c">
                    </lightning-input-field>
                </template>
            </div>

            <lightning-button type="submit" label="Create" variant="brand">
            </lightning-button>

        </lightning-record-edit-form>
    </lightning-card>

</template>
