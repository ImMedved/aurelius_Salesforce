<template>
    <lightning-card icon-name="standard:event" title="Exam Period Entry" class="slds-card__body_inner">

        <lightning-record-edit-form object-api-name="Exam__c" onsuccess={handleSuccess} onerror={handleError}>

            <lightning-messages></lightning-messages>

            <div class="slds-m-bottom_small">
                <div class="slds-form-element slds-form-element_horizontal">
                    <label class="slds-form-element__label">Exam Period Name</label>
                    <div class="slds-form-element__control">
                        <lightning-input-field field-name="Name" required variant="label-hidden">
                        </lightning-input-field>
                    </div>
                </div>

                <div class="slds-form-element slds-form-element_horizontal">
                    <label class="slds-form-element__label">Subject</label>
                    <div class="slds-form-element__control">
                        <lightning-input-field field-name="Subject__c" variant="label-hidden">
                        </lightning-input-field>
                    </div>
                </div>

                <div class="slds-form-element slds-form-element_horizontal">
                    <label class="slds-form-element__label">Date</label>
                    <div class="slds-form-element__control">
                        <lightning-input-field field-name="Date__c" variant="label-hidden">
                        </lightning-input-field>
                    </div>
                </div>
            </div>

            <lightning-button type="submit" label="Insert" variant="brand">
            </lightning-button>

        </lightning-record-edit-form>
    </lightning-card>
</template>
